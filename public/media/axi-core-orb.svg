<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-light" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glitch-filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.15" numOctaves="1" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Outer Tech Ring -->
  <circle cx="200" cy="200" r="170" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1" fill="none"/>
  <circle cx="200" cy="200" r="170" stroke="#00f0ff" stroke-width="3.5" stroke-dasharray="25 60 140 10" fill="none" filter="url(#glow-light)">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Middle Magenta Ring (Counter rotation) -->
  <circle cx="200" cy="200" r="130" stroke="rgba(255, 0, 127, 0.2)" stroke-width="1.5" fill="none"/>
  <circle cx="200" cy="200" r="130" stroke="#ff007f" stroke-width="3" stroke-dasharray="80 15 30 8" fill="none" filter="url(#glow-light)">
    <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner Cyan Ring (Fast rotation) -->
  <circle cx="200" cy="200" r="95" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" stroke-dasharray="4 8" fill="none"/>
  <circle cx="200" cy="200" r="95" stroke="#00f0ff" stroke-width="2" stroke-dasharray="40 180" fill="none">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Core Pulsator -->
  <circle cx="200" cy="200" r="60" fill="rgba(0, 240, 255, 0.05)" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow-heavy)">
    <animate attributeName="r" values="55;65;55" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner Core (Counter spin) -->
  <circle cx="200" cy="200" r="30" fill="rgba(255, 0, 127, 0.1)" stroke="#ff007f" stroke-width="2" stroke-dasharray="5 5">
    <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Singularity -->
  <circle cx="200" cy="200" r="15" fill="#00f0ff" filter="url(#glow-heavy)">
    <animate attributeName="r" values="12;18;12" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Radar Sweep Line -->
  <line x1="200" y1="200" x2="200" y2="30" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Crosshairs -->
  <line x1="200" y1="10" x2="200" y2="40" stroke="rgba(0, 240, 255, 0.5)" stroke-width="1">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="360" x2="200" y2="390" stroke="rgba(0, 240, 255, 0.5)" stroke-width="1">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="10" y1="200" x2="40" y2="200" stroke="rgba(255, 0, 127, 0.5)" stroke-width="1">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </line>
  <line x1="360" y1="200" x2="390" y2="200" stroke="rgba(255, 0, 127, 0.5)" stroke-width="1">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="2s" repeatCount="indefinite"/>
  </line>

  <!-- Glitch Text: RODORIN -->
  <text x="200" y="380" font-family="monospace" font-size="14" font-weight="bold" fill="#00f0ff" text-anchor="middle" filter="url(#glitch-filter)" opacity="0.8">
    RODORIN // AXI-CORE
  </text>

  <!-- Corner markers -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 360 40 L 380 20 L 380 40" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 20 360 L 20 380 L 40 380" stroke="#ff007f" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 360 360 L 380 380 L 380 360" stroke="#ff007f" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Data text around orb -->
  <text x="200" y="15" font-family="monospace" font-size="8" fill="#00f0ff" text-anchor="middle" opacity="0.5">
    SECURE LINK: SEC-NODE-X09 // ESTABLISHED
  </text>
</svg>